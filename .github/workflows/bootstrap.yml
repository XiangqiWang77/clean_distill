name: Bootstrap Clean Self-Distillation repository

on:
  push:
    branches: [main]
    paths:
      - clean_distill_payload.tar.gz
      - .github/workflows/bootstrap.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand source tree
        run: |
          tar -xzf clean_distill_payload.tar.gz
          rm clean_distill_payload.tar.gz
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish Clean Self-Distillation implementation"
          git push
