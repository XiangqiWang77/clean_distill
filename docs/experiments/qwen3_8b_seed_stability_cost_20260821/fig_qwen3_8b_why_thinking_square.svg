<text x="127" y="886" fill="#111111" font-size="21" font-weight="780">Multi-step demand</text>
<text x="83" y="934" fill="#344054" font-size="17" font-weight="450">AMC/AIME solutions require</text>
<text x="83" y="961" fill="#344054" font-size="17" font-weight="450">dependent algebra, case analysis,</text>
<text x="83" y="988" fill="#344054" font-size="17" font-weight="450">and answer verification.</text>
<rect x="435" y="835" width="330" height="245" rx="22" fill="#EEF4FF" stroke="#DDDAD2" stroke-width="1.2" filter="url(#shadow)"/>
<circle cx="472" cy="879" r="22" fill="#2563EB"/>
