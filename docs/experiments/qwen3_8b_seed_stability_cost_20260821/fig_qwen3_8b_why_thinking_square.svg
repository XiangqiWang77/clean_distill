<text x="507" y="886" fill="#111111" font-size="21" font-weight="780">Reasoning workspace</text>
<text x="463" y="934" fill="#344054" font-size="17" font-weight="450">Thinking mode gives Qwen3-8B</text>
<text x="463" y="961" fill="#344054" font-size="17" font-weight="450">room for intermediate steps before</text>
<text x="463" y="988" fill="#344054" font-size="17" font-weight="450">committing to a final answer.</text>
<rect x="815" y="835" width="330" height="245" rx="22" fill="#FFF7CC" stroke="#DDDAD2" stroke-width="1.2" filter="url(#shadow)"/>
<circle cx="852" cy="879" r="22" fill="#FACC15"/>
<text x="852" y="886" fill="#111111" font-size="19" font-weight="800" text-anchor="middle">3</text>
<text x="887" y="886" fill="#111111" font-size="21" font-weight="780">Observed consequence</text>
<text x="843" y="934" fill="#344054" font-size="17" font-weight="450">Thinking rises to 66.43%;</text>
<text x="843" y="961" fill="#344054" font-size="17" font-weight="450">non-thinking falls to 24.48%</text>
<text x="843" y="988" fill="#344054" font-size="17" font-weight="450">after 64 training episodes.</text>
<text x="1145" y="1145" fill="#667085" font-size="13" text-anchor="end">Protocol motivation, not a causal decomposition · one matched seed · no LLM judge</text>
