[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "trsd"
version = "0.1.0"
description = "Trust-Region Self-Distillation"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "accelerate>=1.0,<2",
  "huggingface-hub>=0.30,<1",
  "math-verify>=0.7,<1",
  "numpy>=1.26,<3",
  "packaging>=24,<27",
  "peft>=0.19.1,<0.20",
  "safetensors>=0.4.5,<1",
  "torch>=2.5,<2.10",
  "transformers>=4.51,<5",
  "tqdm>=4.66,<5",
]

[project.optional-dependencies]
data = ["datasets>=3,<5", "pyarrow>=14,<24"]
eval = ["vllm>=0.6,<0.13"]
attention = ["flash-attn>=2.6,<3"]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
